spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.application.name=backend


# Defaults match docker-compose.yaml (postgres on host port 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Gemini Developer API (Google AI Studio)
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=1536

# PgVector Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
# Separate embedding spaces; existing OpenAI vectors remain in vector_store.
spring.ai.vectorstore.pgvector.table-name=vector_store_gemini
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


#GitHub OAuth2 Configuration
# Github Oauth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=GITPLAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
# A batch consumes one quota unit per chunk. 750 ms per chunk allows ~80/minute.
# Adjust to the embedding quota shown for your project in Google AI Studio.
app.indexing.embedding-batch-size=${GEMINI_EMBEDDING_BATCH_SIZE:16}
app.indexing.embedding-delay-ms=${GEMINI_EMBEDDING_DELAY_MS:750}
app.github.api-delay-ms=50
# Reconcile saved repositories against a complete GitHub list at most once/minute.
app.github.repository-sync-interval-ms=60000
